<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中1理科クイズ</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
  button { display: block; width: 100%; margin: .5rem 0; padding: .7rem; font-size: 1rem; cursor: pointer; }
  .correct { background: #c8f7c5; }
  .wrong { background: #f7c5c5; }
  #next, #retry { background: #e0e7ff; }
</style>
</head>
<body>
<h1>中学1年 理科クイズ</h1>
<div id="progress"></div>
<h2 id="question"></h2>
<div id="choices"></div>
<p id="feedback"></p>
<button id="next" hidden>次へ</button>
<button id="retry" hidden>もう一度</button>

<script>
const quiz = [
  { q: "植物の光合成で、葉の緑色の粒（光合成が行われる場所）を何という？", c: ["葉緑体", "核", "細胞壁", "液胞"], a: 0 },
  { q: "光合成でつくられる物質は？", c: ["二酸化炭素と水", "デンプンと酸素", "窒素と水素", "塩化ナトリウム"], a: 1 },
  { q: "種子植物のうち、胚珠が子房の中にある植物は？", c: ["裸子植物", "被子植物", "シダ植物", "コケ植物"], a: 1 },
  { q: "凸レンズで、物体が焦点の外側にあるときにスクリーンに映る像は？", c: ["正立の虚像", "倒立の実像", "正立の実像", "像はできない"], a: 1 },
  { q: "光が空気中からガラスに斜めに入るとき、境界面で曲がる現象は？", c: ["反射", "屈折", "直進", "拡散"], a: 1 },
  { q: "音の高さは何で決まる？", c: ["振幅", "振動数（周波数）", "速さ", "波長の色"], a: 1 },
  { q: "物質の質量[g]÷体積[cm³]で求められるものは？", c: ["圧力", "密度", "濃度", "重力"], a: 1 },
  { q: "火山の噴火でできる、マグマが冷え固まった岩石を何という？", c: ["堆積岩", "火成岩", "変成岩", "石灰岩"], a: 1 },
  { q: "地震で、最初に届く小さなゆれは？", c: ["S波（主要動）", "P波（初期微動）", "津波", "表面波"], a: 1 },
  { q: "水溶液で、溶けている物質を何という？", c: ["溶媒", "溶質", "溶液", "沈殿"], a: 1 }
];
let i = 0, score = 0;
const $ = id => document.getElementById(id);

function show() {
  const item = quiz[i];
  $("progress").textContent = `問題 ${i + 1} / ${quiz.length}`;
  $("question").textContent = item.q;
  $("feedback").textContent = "";
  $("next").hidden = true;
  $("retry").hidden = true;
  $("choices").innerHTML = "";
  item.c.forEach((text, idx) => {
    const b = document.createElement("button");
    b.textContent = text;
    b.onclick = () => answer(idx);
    $("choices").appendChild(b);
  });
}

function answer(idx) {
  const btns = $("choices").children;
  [...btns].forEach((b, n) => {
    b.disabled = true;
    if (n === quiz[i].a) b.classList.add("correct");
  });
  if (idx === quiz[i].a) {
    score++;
    $("feedback").textContent = "正解！";
  } else {
    btns[idx].classList.add("wrong");
    $("feedback").textContent = "不正解…";
  }
  $("next").hidden = false;
  $("next").textContent = i === quiz.length - 1 ? "結果を見る" : "次へ";
}

$("next").onclick = () => {
  if (++i < quiz.length) return show();
  $("progress").textContent = "終了";
  $("question").textContent = `スコア: ${score} / ${quiz.length}`;
  $("choices").innerHTML = "";
  $("feedback").textContent = "";
  $("next").hidden = true;
  $("retry").hidden = false;
};
$("retry").onclick = () => { i = 0; score = 0; show(); };
show();
</script>
</body>
</html>
