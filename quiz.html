<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>クイズ</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
  button { display: block; width: 100%; margin: .5rem 0; padding: .7rem; font-size: 1rem; cursor: pointer; }
  .correct { background: #c8f7c5; }
  .wrong { background: #f7c5c5; }
  #next, #retry { background: #e0e7ff; }
</style>
</head>
<body>
<h1>クイズ</h1>
<div id="progress"></div>
<h2 id="question"></h2>
<div id="choices"></div>
<p id="feedback"></p>
<button id="next" hidden>次へ</button>
<button id="retry" hidden>もう一度</button>

<script>
const quiz = [
  { q: "日本の首都は？", c: ["大阪", "東京", "京都", "名古屋"], a: 1 },
  { q: "1年は何か月？", c: ["10", "11", "12", "13"], a: 2 },
  { q: "HTMLは何の言語？", c: ["マークアップ言語", "データベース", "OS", "画像形式"], a: 0 },
  { q: "地球で一番大きい海は？", c: ["大西洋", "インド洋", "北極海", "太平洋"], a: 3 },
  { q: "2 × 8 = ?", c: ["14", "16", "18", "20"], a: 1 }
];
let i = 0, score = 0;
const $ = id => document.getElementById(id);

function show() {
  const item = quiz[i];
  $("progress").textContent = `問題 ${i + 1} / ${quiz.length}`;
  $("question").textContent = item.q;
  $("feedback").textContent = "";
  $("next").hidden = true;
  $("retry").hidden = true;
  $("choices").innerHTML = "";
  item.c.forEach((text, idx) => {
    const b = document.createElement("button");
    b.textContent = text;
    b.onclick = () => answer(idx);
    $("choices").appendChild(b);
  });
}

function answer(idx) {
  const btns = $("choices").children;
  [...btns].forEach((b, n) => {
    b.disabled = true;
    if (n === quiz[i].a) b.classList.add("correct");
  });
  if (idx === quiz[i].a) {
    score++;
    $("feedback").textContent = "正解！";
  } else {
    btns[idx].classList.add("wrong");
    $("feedback").textContent = "不正解…";
  }
  $("next").hidden = false;
  $("next").textContent = i === quiz.length - 1 ? "結果を見る" : "次へ";
}

$("next").onclick = () => {
  if (++i < quiz.length) return show();
  $("progress").textContent = "終了";
  $("question").textContent = `スコア: ${score} / ${quiz.length}`;
  $("choices").innerHTML = "";
  $("feedback").textContent = "";
  $("next").hidden = true;
  $("retry").hidden = false;
};
$("retry").onclick = () => { i = 0; score = 0; show(); };
show();
</script>
</body>
</html>
